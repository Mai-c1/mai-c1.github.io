<!-- 同步Giscus主题与页面主题（亮色/暗色模式） -->
<script>
  // 获取Giscus脚本元素
  const giscusScript = document.querySelector("script[src*='giscus']");
  
  // 初始加载时设置主题
  const setInitialTheme = () => {
    const palette = __md_get("__palette");
    if (palette && typeof palette.color === "object") {
      const theme = palette.color.scheme === "slate" ? "dark" : "light";
      giscusScript.setAttribute("data-theme", theme);
    }
  };
  
  // 主题切换时同步更新Giscus
  const handleThemeChange = () => {
    const palette = __md_get("__palette");
    if (palette && typeof palette.color === "object") {
      const theme = palette.color.scheme === "slate" ? "dark" : "light";
      
      // 向Giscus iframe发送主题变更消息
      const giscusFrame = document.querySelector(".giscus-frame");
      if (giscusFrame) {
        giscusFrame.contentWindow.postMessage(
          { giscus: { setConfig: { theme } } },
          "https://giscus.app"
        );
      }
    }
  };
  
  // 初始设置主题
  setInitialTheme();
  
  // 监听页面主题切换事件
  document.addEventListener("DOMContentLoaded", () => {
    const paletteSwitch = document.querySelector("[data-md-component='palette']");
    if (paletteSwitch) {
      paletteSwitch.addEventListener("change", handleThemeChange);
    }
  });
</script>
